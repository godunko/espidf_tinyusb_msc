name = "espidf_tinyusb_msc"
version = "0.1.0-dev"
website = "https://github.com/godunko/espidf_tinyusb_msc"
description = "Ada/ESP-IDF: TinyUSB Mass Storage Class bindings"
long-description = """
Ada bindings for the Mass Storage Class (MSC) part of Espressif's TinyUSB integration
(`espressif/esp_tinyusb`).

Covers creation of an MSC storage backed by a wear-levelled internal flash partition,
and switching of its mount point between the application (VFS) and the USB host.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "*"
espidf_tinyusb = "*"
espidf_wear_levelling = "*"
